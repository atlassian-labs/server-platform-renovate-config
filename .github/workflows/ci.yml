name: Validate Renovate config

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate Renovate presets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate presets with the deployed Renovate version
        run: npm run verify:config

  validate-regex:
    name: Validate regular expressions in Renovate presets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild re2

      - name: Validate regular expressions
        run: npm run verify:regex
